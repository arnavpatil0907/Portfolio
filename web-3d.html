    · pop-up photos     →  images: ["images/a.jpg", "images/b.jpg"]
    · pop-up text       →  desc: "One line about the project."
    · external link     →  url: "https://..."  (shows OPEN PROJECT ↗)
  Clicking a card opens a pop-up with the photos + description.
  ═══════════════════════════════════════════════════════════════════
-->

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web & 3D — Arnav Patil</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;800&family=Schibsted+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0B0B0E;--bg-2:#121218;--bg-3:#17171f;
  --ivory:#E9E7DF;--dim:#9A9A93;--faint:#66665f;
  --line:rgba(233,231,223,.10);--line-strong:rgba(233,231,223,.22);
  --indigo:#7E92FF;--violet:#B48CFF;--red:#FF6276;
  --grad:linear-gradient(92deg,#7E92FF 0%,#B48CFF 48%,#FF6276 100%);
  --accent:#5CE1FF;                       /* this page's accent color */
  --accent-glow:rgba(92,225,255,.28);
  --font-display:'Unbounded',sans-serif;--font-body:'Schibsted Grotesk',sans-serif;--font-mono:'Space Mono',monospace;
  --head-h:64px;--pad:clamp(20px,4.5vw,52px);--maxw:1440px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
/* hidden page scrollbar — the progress bar is the scroll indicator */
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:var(--bg);color:var(--ivory);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
::selection{background:var(--accent);color:#0B0B0E}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
/* (film-grain filter removed for image clarity) */
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;justify-content:space-evenly}
.bg-grid span{width:1px;height:100%;background:rgba(233,231,223,.035)}
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:400}
.progress span{display:block;height:100%;background:var(--grad);transform:scaleX(0);transform-origin:left}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.16,.84,.28,1),transform .8s cubic-bezier(.16,.84,.28,1)}
.rv.in{opacity:1;transform:none}
.sec-label{
  display:inline-flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;color:var(--dim);
  border:1px solid var(--line-strong);padding:9px 16px;background:rgba(16,16,22,.65);
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px));
}
.sec-label i{width:8px;height:8px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 10px var(--accent-glow)}
.wm-wrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;user-select:none;display:flex;align-items:center}
.wm{font-family:var(--font-display);font-weight:800;white-space:nowrap;font-size:clamp(90px,17vw,240px);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(233,231,223,.07);will-change:transform}
.orn{position:absolute;z-index:0;pointer-events:none;user-select:none;font-size:clamp(18px,2.4vw,30px);opacity:.5;will-change:transform;text-shadow:0 0 20px currentColor}

/* cyberpunk layer — scanlines + glitch */
body::before{content:"";position:fixed;inset:0;z-index:450;pointer-events:none;opacity:.045;background:repeating-linear-gradient(0deg,transparent 0 2px,#000 2px 3px)}
@keyframes glitch{
  0%,90%,100%{text-shadow:none;transform:none}
  91%{text-shadow:-3px 0 var(--red),3px 0 #5CE1FF}
  93%{text-shadow:3px 0 var(--red),-3px 0 #5CE1FF;transform:translateX(2px)}
  95%{text-shadow:-2px 0 #5CE1FF,2px 0 var(--violet);transform:translateX(-2px)}
  97%{text-shadow:none}
}

/* header */
header.site{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--head-h);display:flex;align-items:center;background:rgba(11,11,14,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.head-in{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;white-space:nowrap}
.brand em{font-style:normal;width:9px;height:9px;background:var(--grad);transform:rotate(45deg);flex:none}
.head-links{display:flex;align-items:center;gap:22px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em}
.head-links a{color:var(--dim);transition:color .25s;white-space:nowrap}
.head-links a:hover{color:var(--ivory)}
.head-links .pill{border:1px solid var(--line-strong);border-radius:999px;padding:9px 18px;color:var(--ivory)}
.head-links .pill:hover{background:var(--accent);color:#0B0B0E;border-color:var(--accent)}

/* discipline app bar */
.disc-tabs{position:sticky;top:0;z-index:250;margin-top:var(--head-h);background:rgba(11,11,14,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.disc-tabs-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.disc-tabs-in::-webkit-scrollbar{display:none}
.disc-tabs a{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);padding:16px 16px 14px;white-space:nowrap;border-bottom:2px solid transparent;transition:.25s}
.disc-tabs a:hover{color:var(--ivory)}
.disc-tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.disc-tabs .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;color:var(--faint);padding:18px 14px 0 0;flex:none}

/* page hero */
.p-hero{position:relative;padding:80px 0 30px;z-index:1}
.p-hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,7vw,96px);line-height:1.02;text-transform:uppercase;letter-spacing:-.01em;margin-top:22px;animation:glitch 8s infinite}
.p-hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.p-tag{margin-top:18px;font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;color:var(--dim)}
.p-intro{margin-top:22px;color:var(--dim);font-size:clamp(15px,1.5vw,18px);line-height:1.65;max-width:58ch}
.p-meta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.p-meta span{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--dim);border:1px solid var(--line-strong);border-radius:999px;padding:9px 16px}
.p-meta span b{color:var(--accent);font-weight:400}

/* project grid — cards open the detail pop-up */
.grid-sec{position:relative;z-index:1;padding:50px 0 90px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px}
.pj{display:flex;flex-direction:column;gap:16px;text-align:left;background:linear-gradient(160deg,var(--bg-2),var(--bg-3));border:1px solid var(--line-strong);border-radius:14px;padding:18px;transition:transform .3s,border-color .3s,box-shadow .3s}
.pj:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 0 44px var(--accent-glow)}
.pj-cover{aspect-ratio:4/3;border-radius:8px;border:1px solid var(--line);position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#141419,#141419 12px,#1a1a22 12px,#1a1a22 24px);display:flex;align-items:center;justify-content:center}
.pj-cover img.bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(24px) saturate(1.15) brightness(.45)}
.pj-cover img.fg{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
.pj-cover video{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;background:rgba(10,10,14,.55)}
.pj-cover::before,.pj-cover::after{content:"";position:absolute;width:18px;height:18px;border:1px solid var(--accent);opacity:.7}
.pj-cover::before{top:12px;left:12px;border-right:none;border-bottom:none}
.pj-cover::after{bottom:12px;right:12px;border-left:none;border-top:none}
.pj-cover .ph{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--faint);text-align:center;padding:0 16px}
.pj-open{position:absolute;right:12px;top:12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--ivory);background:rgba(11,11,14,.75);border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px;backdrop-filter:blur(8px);opacity:0;transition:.25s}
.pj:hover .pj-open,.pj:focus-visible .pj-open{opacity:1}
.pj-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:0 4px}
.pj-row b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pj-row span{font-family:var(--font-mono);font-size:11px;color:var(--faint);white-space:nowrap}
.pj-tags{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);padding:0 4px 6px}
.add-tile{display:flex;align-items:center;justify-content:center;text-align:center;min-height:220px;border:1px dashed rgba(233,231,223,.25);border-radius:14px;font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--faint);line-height:2;padding:24px}

/* project detail pop-up */
.modal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modal-back{position:absolute;inset:0;background:rgba(7,7,10,.8);backdrop-filter:blur(10px)}
/* themed scrollbar inside the pop-up */
.modal-card{scrollbar-width:thin;scrollbar-color:var(--accent) rgba(233,231,223,.06)}
.modal-card::-webkit-scrollbar{width:10px}
.modal-card::-webkit-scrollbar-track{background:rgba(233,231,223,.04)}
.modal-card::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--indigo),var(--violet),var(--red));border-radius:999px;border:2px solid var(--bg-2)}
.modal-card::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.modal-card{position:relative;z-index:1;width:min(1200px,96vw);max-height:92vh;overflow:auto;overscroll-behavior:contain;
  background:linear-gradient(165deg,var(--bg-2),var(--bg-3));border:1px solid var(--line-strong);border-radius:18px;
  padding:clamp(24px,4vw,44px);box-shadow:0 30px 90px rgba(0,0,0,.65);animation:mIn .35s cubic-bezier(.16,.84,.28,1)}
@keyframes mIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.m-close{position:absolute;top:18px;right:18px;width:42px;height:42px;border:1px solid var(--line-strong);border-radius:50%;background:rgba(11,11,14,.7);backdrop-filter:blur(6px);font-size:15px;transition:.25s;z-index:2}
.m-close:hover{background:var(--accent);color:#0B0B0E;border-color:var(--accent)}
.modal-card h2{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3.6vw,40px);text-transform:uppercase;margin-top:14px;letter-spacing:-.01em;padding-right:52px}
.m-desc{margin-top:16px;color:var(--dim);font-size:15.5px;line-height:1.65;max-width:60ch}
.m-tags{margin-top:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--faint)}
/* masonry gallery — images keep their true aspect ratio */
.m-gallery{margin-top:26px;column-count:2;column-gap:14px}
.g-tile{margin-bottom:14px;break-inside:avoid;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:rgba(10,10,14,.55);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--faint);text-align:center;content-visibility:auto}
.g-tile.ph-tile{aspect-ratio:4/3;padding:8px;background:repeating-linear-gradient(135deg,#141419,#141419 12px,#1a1a22 12px,#1a1a22 24px)}
.g-tile img{width:100%;height:auto;display:block}
.g-tile video{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#0c0c11}
.m-link{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;border:1px solid var(--line-strong);border-radius:999px;padding:13px 22px;transition:.25s}
.m-link:hover{background:var(--accent);color:#0B0B0E;border-color:var(--accent)}
.m-link[hidden]{display:none}

/* next discipline */
.next-row{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:20px;max-width:var(--maxw);margin:0 auto;padding:56px var(--pad);border-top:1px solid var(--line);transition:.28s}
.next-row:hover{background:linear-gradient(90deg,transparent,var(--accent-glow),transparent);padding-left:calc(var(--pad) + 14px)}
.next-row small{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--faint);display:block;margin-bottom:10px}
.next-row b{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,4vw,48px);text-transform:uppercase;letter-spacing:-.01em}
.next-row .arr{font-size:30px;color:var(--accent)}

footer.site{border-top:1px solid var(--line);position:relative;z-index:1}
.foot-in{max-width:var(--maxw);margin:0 auto;padding:28px var(--pad);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--faint)}
.foot-in a{color:var(--dim);transition:.25s}
.foot-in a:hover{color:var(--accent)}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .head-links{gap:14px}
  .head-links .hide-sm{display:none}
  .m-gallery{column-count:1}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .pj,.next-row{transition:none}
  .modal-card{animation:none}
  .p-hero h1{animation:none}
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   ═══════════  PAGE DATA — EDIT HERE  ═══════════
   ═══════════════════════════════════════════════════════════
   TO ADD A PROJECT: copy one object in `projects` and edit it.
     cover:  "images/thumb.jpg"          → card thumbnail
     images: ["images/1.jpg","..."]      → photos in the pop-up
     desc:   "A line about the project." → pop-up text
     url:    "https://..."               → OPEN PROJECT button
   Leave cover/images out to keep the placeholder tiles.       */
const PAGE = {
  name: "Arnav Patil",                     // shows in header + footer
  no: "SERVICE 04 — WEB & 3D",
  title: 'Web & <em>3D</em>',              // <em> = gradient word
  watermark: "WEB — 3D — WEB — 3D — WEB — 3D",
  tag: "WEB DESIGN · BLENDER · MAYA · UNITY",
  intro: "Website design plus everything 3D — Unity environments, Blender and Maya work. Web case studies for Parvv Banquets are on their way.",
  meta: [ "PROJECTS — <b>4</b>", "TOOLS — <b>Blender · Maya · Unity</b>" ],
  projects: [
    { title: "Unity Environment", meta: "GAME DEV", tags: "UNITY · LEVEL DESIGN",
      desc: "A playable environment built in Unity — explored here through free walkthroughs, from blockout to a lit, detailed scene.",
      cover: "media/gamedev/walkthrough-silent.mp4",
      images: ["media/gamedev/walkthrough-silent.mp4","media/gamedev/unity-recording.mp4"],
      url: "" },
    { title: "Blender Animations", meta: "3D ANIMATION", tags: "BLENDER · RENDERS",
      desc: "Animation studies in Blender — including the classic donut, fully modelled, textured and rendered, plus a set of shorter animation loops.",
      cover: "media/gamedev/donut.mp4",
      images: ["media/gamedev/donut.mp4","media/gamedev/anim-1.mp4","media/gamedev/anim-2.mp4","media/gamedev/anim-3.mp4"],
      url: "" },
    { title: "Models & Renders", meta: "3D MODELLING", tags: "BLENDER · MAYA",
      desc: "Hard-surface and character work modelled in Blender and Maya — stills, renders and works-in-progress.",
      cover: "media/gamedev/blade-thumb.jpg",
      images: ["media/gamedev/saya.png","media/gamedev/model-1.jpg","media/gamedev/model-2.jpg","media/gamedev/model-3.jpg"],
      url: "" },
    { title: "Experiments & Coursework", meta: "MIXED", tags: "3D · MOTION",
      desc: "Early experiments and university coursework — animation tests and render explorations that fed into the larger projects.",
      cover: "media/gamedev/cia-1.mp4",
      images: ["media/gamedev/cia-1.mp4","media/gamedev/exp-1.mp4","media/gamedev/exp-2.mp4"],
      url: "" },
  ],
  next: { title: "Brand & Packaging", url: "brand-packaging.html" },
};
/* ═══════════════ END OF PAGE DATA ═══════════════ */

const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const VID = /\.(mp4|webm|mov)$/i;          // covers & gallery items can be videos too

$('#brandName').textContent = PAGE.name;
$('#pageNo').textContent = PAGE.no;
$('#pageTitle').innerHTML = PAGE.title;           // allows the <em> gradient word
$('#wm').textContent = PAGE.watermark;
$('#pageTag').textContent = PAGE.tag;
$('#pageIntro').textContent = PAGE.intro;
$('#pageMeta').innerHTML = PAGE.meta.map(m => `<span>${m}</span>`).join('');
$('#footCopy').textContent = `© ${new Date().getFullYear()} ${PAGE.name.toUpperCase()}`;
$('#nextRow').href = PAGE.next.url;
$('#nextTitle').textContent = PAGE.next.title;

/* thumbnails — each opens the detail pop-up */
$('#projGrid').innerHTML = PAGE.projects.map((p, i) => `
  <button class="pj rv" data-idx="${i}" aria-haspopup="dialog">
    <span class="pj-cover">
      ${p.cover ? (VID.test(p.cover)
          ? `<video src="${esc(p.cover)}" muted loop playsinline preload="metadata"></video>`
          : `<img class="bg" src="${esc(p.cover)}" alt="" aria-hidden="true" loading="lazy" decoding="async"><img class="fg" src="${esc(p.cover)}" alt="${esc(p.title)} thumbnail" loading="lazy" decoding="async">`)
        : `<span class="ph">[ PROJECT THUMBNAIL — ADD VIA cover ]</span>`}
      <span class="pj-open">DETAILS +</span>
    </span>
    <span class="pj-row"><b>${esc(p.title)}</b><span>${esc(p.meta)}</span></span>
    <span class="pj-tags">${esc(p.tags||'')}</span>
  </button>`).join('');

/* video thumbnails play on hover */
document.querySelectorAll('.pj-cover video').forEach(v => {
  const card = v.closest('.pj');
  card.addEventListener('mouseenter', () => v.play().catch(() => {}));
  card.addEventListener('mouseleave', () => v.pause());
});

/* ---------- detail pop-up ---------- */
const modal = $('#pjModal');
let lastTrigger = null;
function openModal(i){
  const p = PAGE.projects[i];
  if (!p) return;
  lastTrigger = document.activeElement;
  $('#mMeta').textContent = p.meta || '';
  $('#mTitle').textContent = p.title;
  $('#mDesc').textContent = p.desc || 'Add a short description for this project in the PAGE data block.';
  $('#mTags').textContent = p.tags || '';
  /* gallery leads with the project's cover (full-res), then the rest — deduped */
  const coverFull = p.cover ? p.cover.replace(/-thumb\.jpg$/i, '.png') : null;
  const media = [coverFull, ...(p.images || [])].filter((v, i, a) => v && a.indexOf(v) === i);
  $('#mGallery').innerHTML = media.length
    ? media.map(src => `<div class="g-tile">${VID.test(src)
        ? `<video src="${esc(src)}" controls preload="metadata"></video>`
        : `<img src="${esc(src)}" alt="${esc(p.title)} photo" loading="lazy" decoding="async">`}</div>`).join('')
    : [1,2,3].map(n => `<div class="g-tile ph-tile">[ PHOTO ${n} — ADD VIA images ]</div>`).join('');
  /* pop-up video frames match each video's true aspect ratio once metadata loads */
  $('#mGallery').querySelectorAll('video').forEach(v => v.addEventListener('loadedmetadata', () => {
    if (v.videoWidth) v.style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
  }));
  const link = $('#mLink');
  if (p.url && p.url !== '#'){ link.href = p.url; link.textContent = p.linkLabel || 'OPEN PROJECT ↗'; link.hidden = false; } else link.hidden = true;
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  $('.m-close').focus();
}
function closeModal(){
  modal.hidden = true;
  modal.querySelectorAll('video').forEach(v => v.pause());
  document.body.style.overflow = '';
  if (lastTrigger) lastTrigger.focus();
}
$('#projGrid').addEventListener('click', e => {
  const card = e.target.closest('.pj');
  if (card) openModal(+card.dataset.idx);
});
modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
modal.addEventListener('keydown', e => {            // keep Tab inside the pop-up
  if (e.key !== 'Tab' || modal.hidden) return;
  const f = [...modal.querySelectorAll('button,a[href]:not([hidden])')];
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last){ first.focus(); e.preventDefault(); }
});

/* ---------- reveal on scroll ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold:.12, rootMargin:'0px 0px -6% 0px' });
document.querySelectorAll('.rv').forEach(el => io.observe(el));

/* ---------- progress bar + watermark scrub + ornament drift ---------- */
const bar = $('#progressBar'), wm = $('#wm');
const orns = [...document.querySelectorAll('[data-py]')];
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const vh = innerHeight;
    const max = document.documentElement.scrollHeight - vh;
    bar.style.transform = `scaleX(${max > 0 ? scrollY/max : 0})`;
    if (!RM){
      const r = wm.parentElement.getBoundingClientRect();
      const p = (vh - r.top)/(vh + r.height);
      wm.style.transform = `translateX(${(p - .5) * 2 * +wm.dataset.scrub * -1}px)`;
      orns.forEach(o => {
        const pr = o.parentElement.getBoundingClientRect();
        if (pr.bottom < -160 || pr.top > vh + 160) return;
        const pp = (pr.top + pr.height/2 - vh/2) / vh;
        o.style.transform = `translateY(${pp * +o.dataset.py}px)`;
      });
    }
    ticking = false;
  });
}, { passive:true });
</script>
</body>
</html>
